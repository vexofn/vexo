<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXO ESPORTS - Fortnite Team</title>
    <!-- Czcionki: Press Start 2P (Retro), Luckiest Guy (Fortnite), Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Luckiest+Guy&family=Montserrat:ital,wght@0,800;0,900;1,900&display=swap" rel="stylesheet">
    <!-- FontAwesome dla ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #020005;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
        }

        /* EKRAN ŁADOWANIA (LOADING SCREEN) */
        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1c0936 0%, #020005 85%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader-box {
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .mini-vexo {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            color: #00d2ff;
            text-shadow: 0 0 10px #00d2ff, 0 0 20px #a855f7;
            margin-bottom: 12px;
            animation: bounce 0.5s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-12px); }
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: rgba(20, 10, 38, 0.8);
            border: 2px solid rgba(168, 85, 247, 0.6);
            border-radius: 20px;
            padding: 2px;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            position: relative;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #a855f7, #00d2ff);
            border-radius: 20px;
            box-shadow: 0 0 10px #00d2ff;
            transition: width 0.1s linear;
        }

        .loading-text {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            color: #c084fc;
            margin-top: 15px;
            letter-spacing: 2px;
        }

        #start-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            color: #ffffff;
            background: rgba(168, 85, 247, 0.3);
            border: 2px solid #00d2ff;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            animation: pulse-start 1.2s infinite alternate;
            display: none;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        #start-btn:hover {
            transform: scale(1.08);
            background: #00d2ff;
            color: #020005;
            box-shadow: 0 0 40px rgba(0, 210, 255, 1);
        }

        @keyframes pulse-start {
            0% { border-color: #00d2ff; box-shadow: 0 0 15px rgba(0, 210, 255, 0.5); }
            100% { border-color: #e879f9; box-shadow: 0 0 30px rgba(232, 121, 249, 0.8); }
        }

        /* Scena Intro z Perspektywą 3D */
        #intro-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 1500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.2s ease;
            background: radial-gradient(circle at center, #1c0936 0%, #020005 85%);
            will-change: transform;
        }

        .title-container {
            position: relative;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #vexo-text {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(4.5rem, 9vw, 9rem);
            color: #ffffff;
            opacity: 0;
            letter-spacing: 12px;
            text-transform: uppercase;
            transform-style: preserve-3d;
            transform: scale(1.6) translateY(-100px);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.27), opacity 0.3s ease;
            line-height: 1;
        }

        #vexo-text.turned-3d {
            opacity: 1;
            transform: rotateY(20deg) rotateX(-8deg) translateZ(40px);
            text-shadow: 
                -2px 2px 0 #c084fc, -4px 4px 0 #a855f7, -6px 6px 0 #9333ea,
                -8px 8px 0 #7e22ce, -10px 10px 0 #6b21a8, -12px 12px 0 #581c87,
                -14px 14px 0 #3b0764, -16px 16px 25px rgba(168, 85, 247, 0.9),
                0 0 60px rgba(192, 132, 252, 1);
        }

        #esports-text {
            font-family: 'Press Start 2P', cursive;
            position: absolute;
            bottom: -40px;
            right: 0px;
            font-size: clamp(1.2rem, 2.5vw, 2.2rem);
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 8px;
            opacity: 0;
            transform: scale(2.5);
            transition: opacity 0.05s ease;
        }

        #esports-text.pop-in {
            opacity: 1;
            transform: scale(1) rotateY(15deg);
            text-shadow: 
                0 0 10px #fff,
                0 0 20px #00d2ff,
                0 0 40px #00d2ff,
                0 0 80px #00d2ff;
        }

        #fortnite-text {
            font-family: 'Luckiest Guy', cursive;
            font-size: clamp(7rem, 12vw, 12rem);
            color: #0078ff;
            opacity: 0;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 35px;
            transform-style: preserve-3d;
            transform: scale(2.5);
            transition: opacity 0.05s ease;
            line-height: 0.85;
        }

        #fortnite-text.pop-in {
            opacity: 1;
            transform: scale(1) rotateY(20deg) rotateX(-8deg);
            text-shadow: 
                -2px 2px 0 #60a5fa, -4px 4px 0 #2563eb, -6px 6px 0 #1d4ed8,
                -8px 8px 0 #1e3a8a, -10px 10px 0 #0f172a,
                -12px 12px 25px rgba(0, 120, 255, 0.9),
                0 0 80px rgba(0, 210, 255, 1);
        }

        /* MENU ORAZ GRACZE */
        #main-menu, #players-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s ease;
            z-index: 20;
            background: rgba(3, 1, 8, 0.5);
            backdrop-filter: blur(12px);
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .menu-content, .players-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .menu-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .menu-header h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(2rem, 4vw, 3rem);
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 50%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
            line-height: 1.3;
        }

        .menu-header p {
            color: #a855f7;
            font-weight: 800;
            letter-spacing: 4px;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .ceo-badge {
            display: inline-block;
            margin-top: 10px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            color: #00d2ff;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .ceo-badge:hover {
            background: #00d2ff;
            color: #020005;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.9);
            transform: scale(1.08);
            text-shadow: none;
        }

        .menu-btn {
            position: relative;
            width: 420px;
            padding: 20px 0;
            font-size: 1.1rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(20, 10, 38, 0.65);
            border: 2px solid rgba(168, 85, 247, 0.45);
            border-radius: 14px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(15px);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(232, 121, 249, 0.3), rgba(0, 210, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #00d2ff;
            color: #fff;
            background: rgba(168, 85, 247, 0.3);
            box-shadow: 
                0 0 30px rgba(0, 210, 255, 0.7),
                0 0 60px rgba(168, 85, 247, 0.6),
                inset 0 0 20px rgba(0, 210, 255, 0.5);
        }

        /* TABELA GRACZY */
        .players-title {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(1.1rem, 2vw, 1.6rem);
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.8), 0 0 40px rgba(168, 85, 247, 0.8);
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.4;
        }

        .table-container {
            width: 850px;
            max-height: 480px;
            overflow-y: auto;
            background: rgba(18, 9, 36, 0.75);
            border: 2px solid rgba(168, 85, 247, 0.4);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 30px rgba(168, 85, 247, 0.2);
        }

        /* Styl paska przewijania tabeli */
        .table-container::-webkit-scrollbar {
            width: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: rgba(10, 5, 20, 0.5);
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 4px;
        }

        .players-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .players-table th {
            position: sticky;
            top: 0;
            background: #15092b;
            padding: 18px 25px;
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00d2ff;
            text-transform: uppercase;
            border-bottom: 2px solid rgba(168, 85, 247, 0.4);
            z-index: 10;
        }

        .players-table td {
            padding: 18px 25px;
            color: #ccc;
            font-size: 1rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .players-table tr:hover td {
            background: rgba(168, 85, 247, 0.15);
        }

        .rank-tag {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            color: #e879f9;
            margin-right: 10px;
        }

        .player-link {
            color: #fff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .player-link:hover {
            color: #00d2ff;
            text-shadow: 0 0 10px #00d2ff;
        }

        .role-tag {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #c084fc;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pr-val {
            color: #00d2ff;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
        }

        .earn-val {
            color: #4ade80;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(74, 222, 128, 0.5);
        }

        .back-btn {
            margin-top: 15px;
            width: 250px;
            padding: 15px 0;
            font-size: 0.9rem;
        }

        .socials-container {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 25px;
            z-index: 5;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.35s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .social-btn.discord {
            background: rgba(88, 101, 242, 0.2);
            border: 2px solid rgba(88, 101, 242, 0.6);
        }

        .social-btn.discord:hover {
            background: rgba(88, 101, 242, 0.8);
            border-color: #5865F2;
            transform: translateY(-5px) scale(1.08);
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.8);
        }

        .social-btn.twitch {
            background: rgba(145, 70, 255, 0.2);
            border: 2px solid rgba(145, 70, 255, 0.6);
        }

        .social-btn.twitch:hover {
            background: rgba(145, 70, 255, 0.8);
            border-color: #9146FF;
            transform: translateY(-5px) scale(1.08);
            box-shadow: 0 0 30px rgba(145, 70, 255, 0.8);
        }
    </style>
</head>
<body>

    <!-- Odtwarzacz muzyki -->
    <audio id="bg-music" src="music.mp3" loop></audio>

    <!-- Ekran Ładowania (3.5 sekundy) -->
    <div id="loader-screen">
        <div class="loader-box">
            <div class="mini-vexo">VEXO</div>
            <div class="progress-bar-container" id="bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="loading-text" id="loading-text">ŁADOWANIE 0%</div>
            <button id="start-btn">KLIKNIJ, ABY WEJŚĆ</button>
        </div>
    </div>

    <!-- Intro Stage z animacją 3D -->
    <div id="intro-stage">
        <div class="title-container">
            <h1 id="vexo-text">VEXO</h1>
            <span id="esports-text">ESPORTS</span>
        </div>
        <h1 id="fortnite-text">FORTNITE</h1>
    </div>

    <!-- Tło ze spadającymi ikonami -->
    <canvas id="bg-canvas"></canvas>

    <!-- Menu Główna -->
    <div id="main-menu">
        <div class="menu-content">
            <div class="menu-header">
                <h1>VEXO TEAM</h1>
                <p>OFFICIAL FORTNITE ESPORTS</p>
                <a href="https://fortnitetracker.com/profile/all/VEXO%20Szczupak" target="_blank" class="ceo-badge">CEO Szczupak</a>
            </div>

            <button class="menu-btn" id="btn-players">Gracze VEXO</button>
            <button class="menu-btn">Informacje o Drużynie</button>
            <button class="menu-btn">Informacje o Właścicielu</button>
        </div>

        <div class="socials-container">
            <a href="https://discord.gg/GHws4HFQp" target="_blank" class="social-btn discord">
                <i class="fa-brands fa-discord"></i> Discord
            </a>
            <a href="https://www.twitch.tv/vexo_esports" target="_blank" class="social-btn twitch">
                <i class="fa-brands fa-twitch"></i> Twitch
            </a>
        </div>
    </div>

    <!-- Podstrona Gracze VEXO -->
    <div id="players-page">
        <div class="players-content">
            <h2 class="players-title">SKŁAD VEXO ESPORTS</h2>
            
            <div class="table-container">
                <table class="players-table">
                    <thead>
                        <tr>
                            <th>GRACZ</th>
                            <th>ROLA</th>
                            <th>PR</th>
                            <th>EARNINGS</th>
                        </tr>
                    </thead>
                    <tbody id="players-table-body">
                        <!-- Wiersze generowane dynamicznie -->
                    </tbody>
                </table>
            </div>

            <button class="menu-btn back-btn" id="btn-back">Powrót do Menu</button>
        </div>
    </div>

    <script>
        // Lista graczy drużyny VEXO z rolami oraz wstępnymi danymi
        const vexoRoster = [
            { name: "VEXO Szczupak", role: "CEO / IGL" },
            { name: "VEXO MRXavas_", role: "Player" },
            { name: "VEXO armata adaś", role: "Player" },
            { name: "vexo Arta", role: "Player" },
            { name: "VEXO Gazek77", role: "Player" },
            { name: "VEXO_Antrax", role: "Player" },
            { name: "VEXO doxxy 10", role: "Player" }
        ];

        // Pobieranie statystyk i automatyczne sortowanie według PR
        async function loadAndRankPlayers() {
            const tableBody = document.getElementById('players-table-body');
            tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 30px; color: #a855f7;">Pobieranie statystyk i kalkulacja rankingu...</td></tr>';

            const loadedPlayers = [];

            for (const player of vexoRoster) {
                try {
                    // Odpytywanie darmowego Fortnite-API
                    const response = await fetch(`https://fortnite-api.com/v2/stats/br/v2?name=${encodeURIComponent(player.name)}`);
                    const data = await response.json();

                    if (data.status === 200) {
                        const overall = data.data.stats.all.overall;
                        // Obliczanie estymowanego PR na podstawie wygranych i zabójstw
                        const estimatedPR = Math.floor((overall.wins * 35) + (overall.kills * 1.5) + (overall.matches * 0.5));
                        
                        loadedPlayers.push({
                            name: data.data.account.name,
                            role: player.role,
                            pr: estimatedPR,
                            earnings: "$0", // Domyślne earnings, modyfikowalne ręcznie
                            wins: overall.wins
                        });
                    } else {
                        // Rezerwowe dane w przypadku prywatnego profilu / braku odpowiedzi
                        loadedPlayers.push({
                            name: player.name,
                            role: player.role,
                            pr: 0,
                            earnings: "$0",
                            wins: 0
                        });
                    }
                } catch (err) {
                    loadedPlayers.push({
                        name: player.name,
                        role: player.role,
                        pr: 0,
                        earnings: "$0",
                        wins: 0
                    });
                }
            }

            // SORTOWANIE: Im więcej PR, tym wyżej w tabeli
            loadedPlayers.sort((a, b) => b.pr - a.pr);

            // Generowanie HTML tabeli
            let htmlRows = '';
            loadedPlayers.forEach((player, index) => {
                const rankDisplay = `#${index + 1}`;
                const trackerUrl = `https://fortnitetracker.com/profile/all/${encodeURIComponent(player.name)}`;

                htmlRows += `
                    <tr>
                        <td>
                            <span class="rank-tag">${rankDisplay}</span>
                            <a href="${trackerUrl}" target="_blank" class="player-link">${player.name}</a>
                        </td>
                        <td><span class="role-tag">${player.role}</span></td>
                        <td><span class="pr-val">${player.pr.toLocaleString()} PR</span></td>
                        <td><span class="earn-val">${player.earnings}</span></td>
                    </tr>
                `;
            });

            tableBody.innerHTML = htmlRows;
        }

        // ELEMENTY INTERFEJSU & LOGIKA INTRO
        const loaderScreen = document.getElementById('loader-screen');
        const progressFill = document.getElementById('progress-fill');
        const loadingText = document.getElementById('loading-text');
        const barContainer = document.getElementById('bar-container');
        const startBtn = document.getElementById('start-btn');

        const vexoText = document.getElementById('vexo-text');
        const esportsText = document.getElementById('esports-text');
        const fortniteText = document.getElementById('fortnite-text');
        const introStage = document.getElementById('intro-stage');
        const mainMenu = document.getElementById('main-menu');
        const playersPage = document.getElementById('players-page');
        const btnPlayers = document.getElementById('btn-players');
        const btnBack = document.getElementById('btn-back');
        const bgMusic = document.getElementById('bg-music');

        let progress = 0;
        const totalDuration = 3500;
        const intervalTime = 35;
        const step = 100 / (totalDuration / intervalTime);

        const loadingInterval = setInterval(() => {
            progress += step;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadingInterval);
                barContainer.style.display = 'none';
                loadingText.style.display = 'none';
                startBtn.style.display = 'block';
            }
            progressFill.style.width = `${progress}%`;
            loadingText.innerText = `ŁADOWANIE ${Math.floor(progress)}%`;
        }, intervalTime);

        startBtn.addEventListener('click', () => {
            bgMusic.play().catch(err => console.log("Sprawdź czy plik music.mp3 istnieje:", err));
            loaderScreen.style.opacity = '0';
            loaderScreen.style.visibility = 'hidden';
            startIntroSequence();
        });

        function startIntroSequence() {
            setTimeout(() => { vexoText.classList.add('turned-3d'); }, 800);
            setTimeout(() => { esportsText.classList.add('pop-in'); }, 2200);
            setTimeout(() => { fortniteText.classList.add('pop-in'); }, 3500);

            setTimeout(() => {
                introStage.style.opacity = '0';
                setTimeout(() => {
                    introStage.style.display = 'none';
                    mainMenu.style.visibility = 'visible';
                    mainMenu.style.opacity = '1';
                    initSpawningFortniteIcons();
                    loadAndRankPlayers(); // Wczytywanie graczy po wejściu do menu
                }, 1200);
            }, 6000);
        }

        btnPlayers.addEventListener('click', () => {
            mainMenu.style.opacity = '0';
            mainMenu.style.visibility = 'hidden';
            setTimeout(() => {
                playersPage.style.visibility = 'visible';
                playersPage.style.opacity = '1';
            }, 500);
        });

        btnBack.addEventListener('click', () => {
            playersPage.style.opacity = '0';
            playersPage.style.visibility = 'hidden';
            setTimeout(() => {
                mainMenu.style.visibility = 'visible';
                mainMenu.style.opacity = '1';
            }, 500);
        });

        function initSpawningFortniteIcons() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const icons = [];
            for (let i = 0; i < 35; i++) {
                icons.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 26 + 16,
                    speedY: Math.random() * 1.8 + 0.8,
                    speedX: (Math.random() - 0.5) * 0.5,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.02,
                    opacity: Math.random() * 0.45 + 0.15
                });
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                icons.forEach(icon => {
                    icon.y += icon.speedY;
                    icon.x += icon.speedX;
                    icon.rotation += icon.rotSpeed;

                    if (icon.y > height + 40) {
                        icon.y = -40;
                        icon.x = Math.random() * width;
                    }

                    ctx.save();
                    ctx.translate(icon.x, icon.y);
                    ctx.rotate(icon.rotation);
                    ctx.globalAlpha = icon.opacity;
                    ctx.font = `900 ${icon.size}px 'Luckiest Guy', cursive`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#00d2ff';
                    ctx.fillText('F', -2, 1);
                    ctx.fillStyle = '#e879f9';
                    ctx.fillText('F', 2, -1);
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#a855f7';
                    ctx.shadowBlur = 15;
                    ctx.fillText('F', 0, 0);
                    ctx.restore();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.012;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.012;

            if (mainMenu.style.visibility === 'visible') {
                document.querySelector('.menu-content').style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
            if (playersPage.style.visibility === 'visible') {
                document.querySelector('.players-content').style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });
    </script>
</body>
</html>
